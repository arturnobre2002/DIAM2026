<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Candidatura - Eklektikfest Lisboa</title>
    </head>
    <body>
        <header>
            <h1>EKLEKTIKFEST LISBOA</h1>
            <nav>
                <a href="index.html"><img src="dados/logo.png" alt="Logo"></a>
                <a href="index.html">Página Inicial</a> |
                <a href="candidatura.html">Candidatura</a>
            </nav>
        </header>
        <h2>Candidatura - Eklektikfest Lisboa</h2>
        <form action="processar-candidatura.html">
            Nome: <input type="text" name="firstName"><br>
            Telemóvel: <input type="text" name="phone"><br>
            E-mail: <input type="text" name="mail"><br><br>
            Dias de disponibilidade:<br>
            <input type="checkbox" id="13" name="dias" value="13">
            <label for="13"> Dia 13</label><br>
            <input type="checkbox" id="14" name="dias" value="14">
            <label for="14"> Dia 14</label><br>
            <input type="checkbox" id="15" name="dias" value="15">
            <label for="15"> Dia 15</label><br>
            Períodos:<br>
            <input type="checkbox" id="manha" name="periodos" value="manha">
            <label for="manha"> 10h-13h</label><br>
            <input type="checkbox" id="tarde" name="periodos" value="tarde">
            <label for="tarde"> 14h-19h</label><br>
            <input type="checkbox" id="noite" name="periodos" value="noite">
            <label for="noite"> 20h-00h</label><br>
            Tarefas:<br>
            <input type="checkbox" id="bilheteria" name="tarefas" value="bilheteria">
            <label for="bilheteria"> Bilheteria</label><br>
            <input type="checkbox" id="restauracao" name="tarefas" value="restauracao">
            <label for="restauracao"> Restauração</label><br>
            <input type="checkbox" id="montagem" name="tarefas" value="montagem">
            <label for="montagem"> Montagem</label><br>
            <input type="checkbox" id="apoio" name="tarefas" value="apoio">
            <label for="apoio"> Apoio ao público</label><br><br>
        </form>
    </body>
</html>
